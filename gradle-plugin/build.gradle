plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

def projectProperties = new Properties()
file('../gradle.properties').withInputStream { projectProperties.load(it) }
group = projectProperties.getProperty('mod_group_id')
version = projectProperties.getProperty('mod_version')
if (!group || !version) throw new GradleException('mod_group_id and mod_version must be set in the root gradle.properties')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDir '../src/main/java'
            include 'github/com/gengyoubo/mfcl/gradle/**'
            include 'github/com/gengyoubo/mfcl/legacy/runtime/RuntimeInstaller.java'
            include 'github/com/gengyoubo/mfcl/legacy/LegacyDiagnostic.java'
            include 'github/com/gengyoubo/mfcl/legacy/LegacyDiscovery.java'
            include 'github/com/gengyoubo/mfcl/legacy/LegacyRuntimeCheck.java'
            include 'github/com/gengyoubo/mfcl/legacy/LegacyArchive.java'
            include 'github/com/gengyoubo/mfcl/legacy/LegacyMod.java'
            include 'github/com/gengyoubo/mfcl/legacy/LegacyPaths.java'
        }
    }
    runtimePreparation { java.srcDir '../src/preparation/java' }
}

repositories {
    mavenCentral()
}

configurations {
    shade
}

dependencies {
    // Shaded into the plugin JAR so consumers do not need a buildscript classpath entry.
    compileOnly 'org.ow2.asm:asm-commons:9.7.1'
    shade 'org.ow2.asm:asm-commons:9.7.1'
    compileOnly 'org.ow2.asm:asm-tree:9.7.1'
    shade 'org.ow2.asm:asm-tree:9.7.1'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    shade 'com.google.code.gson:gson:2.10.1'
    runtimePreparationImplementation 'org.ow2.asm:asm-commons:9.7.1'
    runtimePreparationImplementation 'org.glavo:pack200:0.3.0'
    runtimePreparationImplementation 'org.tukaani:xz:1.10'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation gradleTestKit()
    testImplementation 'org.ow2.asm:asm-commons:9.7.1'
}

gradlePlugin {
    plugins {
        mfclDirect {
            id = 'mfcl.direct'
            implementationClass = 'github.com.gengyoubo.mfcl.gradle.MfclDirectPlugin'
            displayName = 'MFCL direct classes'
            description = 'Compiles addon classes against the prepared 1.7.10 runtime and packages them under META-INF/mfcl/direct.'
        }
    }
}

tasks.named('jar') {
    from { configurations.shade.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('test') {
    useJUnitPlatform()
}

// TestKit executes task actions, so the shaded dependencies must be on the plugin-under-test classpath too.
tasks.named('pluginUnderTestMetadata') {
    pluginClasspath.from(configurations.shade)
}

tasks.register('runtimePreparationJar', Jar) {
    archiveFileName = 'mfcl-runtime-preparation.jar'
    destinationDirectory = layout.buildDirectory.dir('runtime-preparation')
    from sourceSets.runtimePreparation.output
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
processResources {
    from(tasks.named('runtimePreparationJar')) { into 'mfcl' }
    from('../docs') { include 'nei-reference-inputs.json', 'legacy-language-inputs.json'; into 'mfcl/runtime-inputs' }
    filesMatching('mfcl-direct.properties') {
        expand(version: project.version)
    }
}

publishing {
    repositories {
        maven {
            name = 'mfcl'
            url = uri('../mcmodsrepo')
        }
    }
}
