plugins { id 'java-gradle-plugin' }
group = 'github.com.gengyoubo.mfcl'
version = '0.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
repositories { mavenCentral() }
gradlePlugin {
    plugins {
        legacyDependencies {
            id = 'github.com.gengyoubo.mfcl.legacy-dependencies'
            implementationClass = 'github.com.gengyoubo.mfcl.resolver.LegacyDependencyPlugin'
        }
    }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'mfcl.gradleHome', gradle.gradleHomeDir.absolutePath
    maxParallelForks = 1
}
