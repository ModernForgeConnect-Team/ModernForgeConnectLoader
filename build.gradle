plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.create('api')
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file(providers.gradleProperty('mfclRunDir').getOrElse('run'))
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            if (project.hasProperty('mfclHostSmokeTest') || project.hasProperty('mfclNeiUiSmokeTest') || project.hasProperty('mfclNeiWorldSmokeTest')) {
                property 'mfcl.test.exitAtTitleScreen', 'true'
            }
            if (project.hasProperty('mfclNeiUiSmokeTest') || project.hasProperty('mfclNeiWorldSmokeTest')) property 'mfcl.test.neiUiSmoke', 'true'
            if (project.hasProperty('mfclNeiWorldSmokeTest')) property 'mfcl.test.neiWorldSmoke', 'true'
            if (project.hasProperty('mfclModListSmokeTest')) property 'mfcl.test.modListSmoke', 'true'
            if (project.hasProperty('mfclOpenGlSmokeTest')) property 'mfcl.test.openGl', 'true'
            if (project.hasProperty('mfclContentSmokeTest')) property 'mfcl.test.content', 'true'
            if (project.hasProperty('mfclLogicSmokeTest')) property 'mfcl.test.logic', 'true'
            if (project.hasProperty('mfclBookSmokeTest')) property 'mfcl.test.book', 'true'
            if (project.hasProperty('mfclScannerSmokeTest')) property 'mfcl.test.scanner', 'true'
            if (project.hasProperty('mfclBiomeSmokeTest')) property 'mfcl.test.biomes', 'true'
            if (project.hasProperty('mfclTooltipSmokeTest')) property 'mfcl.test.tooltip', 'true'
            if (project.hasProperty('mfclDeviceSmokeTest')) property 'mfcl.test.device', 'true'
            if (project.hasProperty('mfclCraftingSmokeTest')) property 'mfcl.test.crafting', 'true'
            if (project.hasProperty('mfclApiSmokeTest')) property 'mfcl.test.api', 'true'
            if (project.hasProperty('mfclServerSmokeTest')) property 'mfcl.test.server', project.property('mfclServerSmokeTest')
            if (project.hasProperty('mfclSmokePrefix')) property 'mfcl.test.smokePrefix', project.property('mfclSmokePrefix')
            if (project.hasProperty('mfclLegacyGui')) property 'mfcl.legacyGui', 'true'
            if (project.hasProperty('mfclLegacyBrowser')) property 'mfcl.legacyGui', 'false'
            if (project.hasProperty('legacyRuntimeDir')) {
                property 'mfcl.legacyRuntimeDir', file(project.property('legacyRuntimeDir')).absolutePath
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.api
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    maven { url = 'https://libraries.minecraft.net' }
    maven {
        url "https://cursemaven.com"
    }
}
sourceSets {
    create('preparation')
    create('legacy1710')
}
dependencies {
    implementation sourceSets.api.output
    preparationImplementation 'org.ow2.asm:asm:9.7.1'
    preparationImplementation 'org.ow2.asm:asm-commons:9.7.1'
    preparationImplementation 'org.glavo:pack200:0.3.0'
    preparationImplementation 'org.tukaani:xz:1.10'
    legacy1710CompileOnly 'net.minecraft:launchwrapper:1.12'
    legacy1710CompileOnly 'org.ow2.asm:asm-debug-all:5.0.3'
    legacy1710CompileOnly 'com.google.guava:guava:17.0'
    legacy1710CompileOnly 'net.minecraftforge:forge:1.7.10-10.13.4.1614-1.7.10:universal'
}
tasks.named('compileLegacy1710Java', JavaCompile) { options.release = 8 }
tasks.register('legacyJar', Jar) {
    archiveFileName = 'mfcl-legacy-runtime.jar'
    destinationDirectory = layout.buildDirectory.dir('legacy')
    from sourceSets.legacy1710.output
}
tasks.named('processResources') {
    from(tasks.named('legacyJar')) { into 'mfcl' }
}
tasks.register('prepareLegacyRuntime', JavaExec) {
    group = 'development'
    description = 'Apply verified Forge client binary patches and SRG mappings to a private runtime cache.'
    classpath = sourceSets.preparation.runtimeClasspath
    mainClass = 'github.com.gengyoubo.mfcl.tools.PrepareLegacyRuntime'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    args file('build/research-round2/artifacts/minecraft-client-1.7.10.jar').absolutePath,
            file('build/nei-investigation/runtime/forge-1.7.10-10.13.4.1614-1.7.10-universal.jar').absolutePath,
            file('build/research-round2/artifacts/joined-1.7.10.srg').absolutePath,
            file('build/nei-investigation/runtime/minecraft-forge-1.7.10-srg.jar').absolutePath
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    runtimeOnly fg.deobf("curse.maven:jei-238222:9205046")
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.apache.maven:maven-artifact:3.8.5'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from sourceSets.api.output
    from('LICENSE')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.register('apiSourcesJar', Jar) {
    archiveClassifier = 'api-sources'
    from sourceSets.api.allSource
    from('LICENSE')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble') { dependsOn 'apiJar', 'apiSourcesJar', 'compileApiExample' }
tasks.register('compileApiExample', JavaCompile) {
    description = 'Compile the addon example against only the standalone API, without either Minecraft version.'
    source = fileTree('examples/legacy-accessor/src') { include '**/*.java' }
    classpath = sourceSets.api.output
    destinationDirectory = layout.buildDirectory.dir('api-example')
    options.release = 17
}
tasks.named('jar', Jar).configure {
    from('LICENSE')
    from sourceSets.api.output
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact tasks.named('apiJar')
            artifact tasks.named('apiSourcesJar')
        }
        register('developerApi', MavenPublication) {
            artifactId = 'mfcl-api'
            artifact(tasks.named('apiJar')) { classifier = null }
            artifact(tasks.named('apiSourcesJar')) { classifier = 'sources' }
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'mfcl.test.runtimeClasspath', sourceSets.test.runtimeClasspath.asPath
    if (project.hasProperty('neiJar')) {
        inputs.file(file(project.property('neiJar')))
        systemProperty 'mfcl.test.neiJar', file(project.property('neiJar')).absolutePath
    }
    if (project.hasProperty('legacySupportDir')) {
        inputs.files(fileTree(file(project.property('legacySupportDir'))) { include '*.jar', 'runtime/*.jar', 'runtime/runtime-manifest.json' })
        systemProperty 'mfcl.test.legacySupportDir', file(project.property('legacySupportDir')).absolutePath
    }
    for (String input : ['thaumcraftJar', 'baublesJar']) {
        if (project.hasProperty(input)) {
            inputs.file(file(project.property(input)))
            systemProperty "mfcl.test.${input}", file(project.property(input)).absolutePath
        }
    }
}

tasks.register('inspectLegacyMods', JavaExec) {
    group = 'verification'
    description = 'Inspect mods/1.7.10 without defining legacy mod classes.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'github.com.gengyoubo.mfcl.legacy.LegacyInspector'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    args file(providers.gradleProperty('legacyGameDir').getOrElse('run')).absolutePath
}

tasks.register('probeLegacyCoremod', JavaExec) {
    group = 'verification'
    description = 'Run an original legacy core-plugin handshake; does not start Minecraft or its client.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'github.com.gengyoubo.mfcl.legacy.runtime.LegacyCoremodProbe'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    doFirst {
        if (!project.hasProperty('legacySupportDir') || !project.hasProperty('legacyModId')) {
            throw new GradleException('Specify -PlegacySupportDir=<directory> -PlegacyModId=<id> and optionally -PlegacyGameDir=<game directory>')
        }
        def probeGameDir = file(providers.gradleProperty('legacyGameDir').getOrElse('run'))
        probeGameDir.mkdirs()
        workingDir probeGameDir
        def supportRoot = file(project.property('legacySupportDir'))
        def runtimeSupport = new File(supportRoot, 'runtime')
        args probeGameDir.absolutePath,
                (runtimeSupport.isDirectory() ? runtimeSupport : supportRoot).absolutePath, project.property('legacyModId')
    }
}

tasks.register('bootLegacyRuntime', JavaExec) {
    group = 'verification'
    description = 'Execute real legacy FML and coremod transformers, retaining stage failures in a JSON report.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'github.com.gengyoubo.mfcl.legacy.runtime.EmbeddedLegacyRuntime'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    def bootGameDir = file(providers.gradleProperty('legacyGameDir').getOrElse('build/nei-smoke/game'))
    workingDir bootGameDir
    doFirst { bootGameDir.mkdirs() }
    args bootGameDir.absolutePath,
            file(providers.gradleProperty('legacyRuntimeDir').getOrElse('build/nei-investigation/runtime')).absolutePath
}
